[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deadcode-audit"
version = "0.1.0"
readme = "README.md"
description = "Standalone Python quality, reachability, cycles, duplication and mutation audit"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6,<7"]

[project.scripts]
deadcode = "deadcode_audit.cli:main"

[project.optional-dependencies]
vulture = ["vulture==2.15"]
mutation = ["mutmut==3.4.0", "pytest>=8,<10"]
embeddings = ["numpy>=1.26", "torch>=2.2", "transformers>=4.40,<5"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9", "build", "numpy>=1.26"]

[tool.hatch.build.targets.wheel]
packages = ["src/deadcode_audit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
