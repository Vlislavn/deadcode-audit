name: Package checks
'on': [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --prefix "$RUNNER_TEMP/deadcode-js" --ignore-scripts --no-audit --no-fund --save-exact oxlint@1.90.0
          echo "DEADCODE_TEST_OXLINT=$RUNNER_TEMP/deadcode-js/node_modules/.bin/oxlint" >> "$GITHUB_ENV"
      - run: uv sync --extra vulture --extra mutation --extra javascript
      - run: uv run --no-sync pytest -q
      - run: uv run --no-sync ruff check --select E9,F src tests
      - run: uv build
