name: Package checks
'on': [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --extra vulture --extra mutation
      - run: uv run --no-sync pytest -q
      - run: uv run --no-sync ruff check --select E9,F src tests
      - run: uv build
